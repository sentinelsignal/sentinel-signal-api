name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Validate OpenAPI document
        run: |
          pip install openapi-spec-validator==0.7.2
          python -m openapi_spec_validator openapi/openapi.json

      - name: Postman collection is generated from the spec
        run: python tools/generate_postman.py --check

      - name: Contract tests (mock server, Python and JS SDKs)
        run: pytest -q tests

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
